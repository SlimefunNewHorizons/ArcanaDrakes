# DrakesArcana operational configuration.
# Tune values here and restart the server. Secrets and external service credentials do not belong here.

profiles:
  assign-random-affinity-on-first-join: true
  allow-staff-affinity-correction: true
  available-affinities: [FIRE, EARTH, AIR, WATER, ICE, ELECTRO]
  origins:
    FIRE: [PHOENIX, BLAZE]
    EARTH: [IRON_GUARDIAN, RAVAGER]
    AIR: [BREEZE, PHANTOM]
    WATER: [GUARDIAN, DROWNED]
    ICE: [STRAY, SNOW_GUARDIAN]
    ELECTRO: [ENDER_WALKER, STORM_CALLER]

combat:
  # Arcana remains PvE-only until a deliberately configured divine PvP area exists.
  offensive-worlds: [world, drakes_bosses]
  allow-player-vs-player: false
  monsters-only: true
  respect-claims: true
  respect-worldguard: true
  pulse:
    damage: 4.0
    range: 10
    knockback: 0.32
  domain:
    radius: 7.0
    damage-per-tick: 0.7

affinities:
  # Probabilidad de que una cuenta nueva salga con Caos, de 0 a 1.
  # Caos no entra en el reparto normal de las seis escuelas: si saliera una de cada siete, la
  # afinidad mas fuerte del servidor seria tambien la mas comun. 0.02 = una de cada cincuenta.
  chaos-chance: 0.02

effects:
  maximum-concurrent-domains: 6
  pulse-cooldown-seconds: 20
  pulse-damage: 4.0
  domain-cooldown-seconds: 180
  domain-duration-seconds: 8
  particles-per-pulse-step: 4
  domain-points: 28
  # Lo que hace distinto al Caos. Comparte cooldowns con el resto: pega mas fuerte, no mas seguido.
  chaos:
    pulse-damage-multiplier: 1.75
    # El rayo no se gasta en el primer cuerpo: atraviesa hasta tres.
    pulse-chains: 3
    domain-radius: 11.0
    domain-damage: 1.6
    domain-duration-multiplier: 2

progression:
  # Canonical tuning values for the public ladder and future mine/quest rewards.
  ranks:
    DESPERTAR: 0
    EXPLORADOR: 1000
    CATALIZADOR: 5000
    VANGUARDIA: 15000
    ASCENDIDO: 40000
    ARCONTE: 100000
  sigils:
    enabled: true
    death-loss-percent: 0
    weekly-upkeep-enabled: false

spirituality:
  enabled: true
  # Essence belongs only to Arcana. It never mints, transfers or spends DiosesDrakes favor.
  maximum-spirit: 10000
  meditation:
    cooldown-seconds: 300
    base-experience: 40
    base-spirit: 12
    base-sigils: 1
  resonance:
    # Compatible patrons grant a modest Arcana-only meditation bonus. Every value is live-balanceable here.
    compatible-base-multiplier: 1.10
    favor-per-tier: 100
    maximum-favor-tiers: 3
    bonus-per-favor-tier: 0.05
    compatible-gods:
      FIRE: [ZEUS, APOLLO, HEPHAESTUS, HESTIA, RA, SET, BRIGID, LUGH]
      EARTH: [DEMETER, HADES, PERSEPHONE, RHEA, DAGDA, CERNUNNOS, ANUBIS]
      AIR: [HERMES, ARTEMIS, ODIN, HEIMDALL, HORUS, MORRIGAN]
      WATER: [POSEIDON, OCEANUS, TETHYS, ISIS, BASTET]
      ICE: [SELENE, MORPHEUS, ODIN, ANUBIS, MORRIGAN]
      ELECTRO: [ZEUS, THOR, TYR, HORUS, LUGH]
      # Caos resuena solo con los dioses que rompen el orden establecido.
      CHAOS: [SET, LOKI, ERIS, NYX, APEP, HADES]

mines:
  enabled: true
  world: arcana_mines
  regenerate-seconds: 600
  entry-rank: DESPERTAR
  rewards:
    experience-per-ore: 8
    sigils-per-ore: 1
  # The mine generator consumes this palette as its implementation evolves.
  # No premium Slimefun, Infinity, Supreme, armor, weapons, or direct endgame items belong here.
  palette:
    common: [COAL_ORE, COPPER_ORE, IRON_ORE]
    uncommon: [GOLD_ORE, REDSTONE_ORE, LAPIS_ORE]
    rare: [DIAMOND_ORE, EMERALD_ORE, AMETHYST_BLOCK]

traders:
  enabled: true
  villager-name: '&dArcane Quartermaster'
  currency: SIGILS
  allow-player-trading: false
  refresh-seconds: 1800
  # Intended for components and exploration materials, never finished Infinity/Supreme gear.
  catalog-mode: MATERIALS_AND_COMPONENTS

equipment:
  enabled: true
  require-rank: true
  allow-direct-purchase: false
  tiers:
    runic:
      minimum-rank: CATALIZADOR
      base-material: DIAMOND
    astral:
      minimum-rank: ASCENDIDO
      base-material: NETHERITE

integrations:
  drakesbosses:
    enabled: true
    allow-boss-world: true
  dioses-drakes:
    enabled: true
  aura-skills:
    enabled: true
    duplicate-experience: false
  element-manipulation:
    enabled: true
    duplicate-items: false
  protectionstones:
    enabled: true
  worldguard:
    enabled: true

# Legacy aliases retained for older generated configs. New installs use combat.*.
worlds:
  offensive-enabled: [world, drakes_bosses]
  player-vs-player: false
messages:
  prefix: '&8[&dArcana&8] '
